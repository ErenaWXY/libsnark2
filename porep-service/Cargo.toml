[package]
name = "porep-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
sha2 = "0.10"

filecoin-proofs = { path = "../third_party/rust-fil-proofs/filecoin-proofs" }
filecoin-hashers = { path = "../third_party/rust-fil-proofs/filecoin-hashers" }
fr32 = { path = "../third_party/rust-fil-proofs/fr32" }

